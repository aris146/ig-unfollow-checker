<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Unfollow Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    h1 { color: #1e88e5; }
    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input { margin-bottom: 10px; }
    pre {
      background: #111;
      color: #0f0;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body><div class="box">
  <h1>Instagram Unfollow Checker</h1>  <p>Upload <b>following.json</b> dan <b>followers_1.json</b></p><input type="file" id="followingFile" accept=".json"><br> <input type="file" id="followersFile" accept=".json"><br><br>

<button onclick="processFiles()">Cek Sekarang</button>

  <pre id="output"></pre></div><script>
function normalize(username) {
  return username.trim().toLowerCase();
}

function processFiles() {
  const followingFile = document.getElementById('followingFile').files[0];
  const followersFile = document.getElementById('followersFile').files[0];
  const output = document.getElementById('output');

  if (!followingFile || !followersFile) {
    output.textContent = '⚠️ Upload kedua file JSON terlebih dahulu';
    return;
  }

  Promise.all([
    readJSON(followingFile),
    readJSON(followersFile)
  ]).then(([followingData, followersData]) => {

    // ===== FOLLOWING =====
    const following = followingData.relationships_following
      .map(e => normalize(e.title));

    // ===== FOLLOWERS =====
    const followers = followersData
      .map(e => normalize(e.string_list_data[0].value));

    const followingSet = new Set(following);
    const followersSet = new Set(followers);

    const notFollowBack = [...followingSet].filter(u => !followersSet.has(u));
    const youNotFollowBack = [...followersSet].filter(u => !followingSet.has(u));
    const mutual = [...followingSet].filter(u => followersSet.has(u));

    let result = '';
    result += '===== HASIL ANALISIS INSTAGRAM =====\n\n';
    result += `Total Following       : ${followingSet.size}\n`;
    result += `Total Followers       : ${followersSet.size}\n`;
    result += `Mutual                : ${mutual.length}\n`;
    result += `Tidak Follback        : ${notFollowBack.length}\n`;
    result += `Kamu Tidak Follback   : ${youNotFollowBack.length}\n\n`;

    result += '===== DAFTAR TIDAK FOLLBACK =====\n';
    notFollowBack.sort().forEach(u => result += u + '\n');

    output.textContent = result;

  }).catch(err => {
    output.textContent = '❌ Gagal membaca file JSON';
    console.error(err);
  });
}

function readJSON(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        resolve(JSON.parse(reader.result));
      } catch (e) {
        reject(e);
      }
    };
    reader.readAsText(file);
  });
}
</script></body>
</html>
