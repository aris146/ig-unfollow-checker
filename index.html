<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Unfollow Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #1877f2;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    input {
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #145dbf;
    }
    pre {
      text-align: left;
      background: #eee;
      padding: 10px;
      max-height: 300px;
      overflow: auto;
    }
  </style>
</head>
<body>

  <h1>Instagram Unfollow Checker</h1>

  <div class="box">
    <p><strong>Upload following.json</strong></p>
    <input type="file" id="followingFile" accept=".json"><br>

    <p><strong>Upload followers_*.json (bisa pilih banyak)</strong></p>
    <input type="file" id="followersFile" accept=".json" multiple><br><br>

    <button onclick="processFiles()">Check</button>

    <h3>Hasil:</h3>
    <pre id="output"></pre>
  </div>

<script>
function extractUsername(entry) {
  if (entry.title) return entry.title;
  if (entry.string_list_data && entry.string_list_data[0]) {
    if (entry.string_list_data[0].value) return entry.string_list_data[0].value;
    if (entry.string_list_data[0].href) {
      const href = entry.string_list_data[0].href;
      const parts = href.split("/_u/");
      if (parts[1]) return parts[1].replace("/", "");
    }
  }
  return null;
}

async function processFiles() {
  const followingInput = document.getElementById('followingFile').files[0];
  const followersInput = document.getElementById('followersFile').files;
  const output = document.getElementById('output');

  if (!followingInput || followersInput.length === 0) {
    output.textContent = "Upload semua file dulu.";
    return;
  }

  const followingText = await followingInput.text();
  const followingData = JSON.parse(followingText);

  let followingList = [];
  const followingArray = followingData.relationships_following || followingData;

  followingArray.forEach(entry => {
    const username = extractUsername(entry);
    if (username) followingList.push(username);
  });

  let followersList = [];

  for (let file of followersInput) {
    const text = await file.text();
    const data = JSON.parse(text);
    const array = data.relationships_followers || data;

    array.forEach(entry => {
      const username = extractUsername(entry);
      if (username) followersList.push(username);
    });
  }

  const followingSet = new Set(followingList);
  const followersSet = new Set(followersList);

  const mutual = [...followingSet].filter(x => followersSet.has(x));
  const notFollowBack = [...followingSet].filter(x => !followersSet.has(x));
  const youNotFollowBack = [...followersSet].filter(x => !followingSet.has(x));

  output.textContent =
    `Total Following: ${followingSet.size}\n` +
    `Total Followers: ${followersSet.size}\n` +
    `Mutual: ${mutual.length}\n` +
    `Tidak Follback: ${notFollowBack.length}\n` +
    `Kamu Tidak Follback: ${youNotFollowBack.length}\n\n` +
    `=== DAFTAR TIDAK FOLLBACK ===\n` +
    notFollowBack.join("\n");
}
</script>

</body>
</html>
