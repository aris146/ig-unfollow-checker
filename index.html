<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Unfollow Checker Pro</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; padding:20px; }
    h1 { color:#1e88e5; }
    .box { background:white; padding:20px; border-radius:10px; max-width:750px; margin:auto; box-shadow:0 3px 10px rgba(0,0,0,0.1);}    
    input { margin-bottom:10px; }
    button { padding:8px 14px; margin-right:5px; border:none; border-radius:6px; cursor:pointer; }
    .primary { background:#1e88e5; color:white; }
    .secondary { background:#444; color:white; }
    pre { background:#111; color:#0f0; padding:10px; overflow-x:auto; max-height:350px; }
    label { font-size:14px; }
  </style>
</head>
<body><div class="box">
  <h1>Instagram Unfollow Checker Pro</h1>  <p>Upload <b>following.json</b> dan <b>followers_1.json</b></p><input type="file" id="followingFile" accept=".json"><br> <input type="file" id="followersFile" accept=".json"><br>

<label><input type="checkbox" id="toggleInactive"> Sembunyikan akun berpotensi nonaktif</label><br> <label><input type="checkbox" id="toggleMutual"> Sembunyikan akun mutual</label> <br><br>

<button class="primary" onclick="processFiles()">Analisis</button> <button class="secondary" onclick="exportTXT()">Export TXT</button>

  <pre id="output"></pre></div><script>
let lastResultText = '';

function normalize(username){ return username.trim().toLowerCase(); }

function processFiles(){
  const followingFile = document.getElementById('followingFile').files[0];
  const followersFile = document.getElementById('followersFile').files[0];
  const hideInactive = document.getElementById('toggleInactive').checked;
  const hideMutual = document.getElementById('toggleMutual').checked;
  const output = document.getElementById('output');

  if(!followingFile || !followersFile){
    output.textContent = 'Upload kedua file terlebih dahulu!';
    return;
  }

  Promise.all([readJSON(followingFile), readJSON(followersFile)])
  .then(([followingData, followersData])=>{

    const followingRaw = followingData.relationships_following || [];

    const following = followingRaw.map(e=>({
      username: normalize(e.title),
      timestamp: e.string_list_data?.[0]?.timestamp || 0
    }));

    const followers = followersData.map(e=>normalize(e.string_list_data[0].value));

    const followingSet = new Set(following.map(u=>u.username));
    const followersSet = new Set(followers);

    const mutual = [...followingSet].filter(u=>followersSet.has(u));
    const notFollowBack = [...followingSet].filter(u=>!followersSet.has(u));
    const youNotFollowBack = [...followersSet].filter(u=>!followingSet.has(u));

    const now = Math.floor(Date.now()/1000);
    const oneYear = 31536000;

    let result = '';
    result += '===== HASIL ANALISIS INSTAGRAM =====\n\n';
    result += `Total Following       : ${followingSet.size}\n`;
    result += `Total Followers       : ${followersSet.size}\n`;
    result += `Mutual                : ${mutual.length}\n`;
    result += `Tidak Follback        : ${notFollowBack.length}\n`;
    result += `Kamu Tidak Follback   : ${youNotFollowBack.length}\n\n`;

    result += '===== DAFTAR TIDAK FOLLBACK =====\n';

    notFollowBack.sort().forEach(u=>{
      const data = following.find(f=>f.username===u);
      const isOld = data && (now - data.timestamp > oneYear);

      if(hideInactive && isOld) return;

      result += u;
      if(isOld) result += '  (⚠ kemungkinan tidak aktif)';
      result += '\n';
    });

    if(!hideMutual){
      result += '\n===== MUTUAL =====\n';
      mutual.sort().forEach(u=> result += u + '\n');
    }

    lastResultText = result;
    output.textContent = result;
  })
  .catch(err=>{
    output.textContent='Gagal membaca file.';
    console.error(err);
  });
}

function exportTXT(){
  if(!lastResultText){ alert('Analisis dulu sebelum export!'); return; }
  const blob = new Blob([lastResultText], {type:'text/plain'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'hasil_instagram.txt';
  link.click();
}

function readJSON(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{ resolve(JSON.parse(reader.result)); }
      catch(e){ reject(e); }
    };
    reader.readAsText(file);
  });
}
</script></body>
</html>
